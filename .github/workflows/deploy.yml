name: Build and Deploy Vue App

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # دریافت سورس پروژه
      - name: Checkout
        uses: actions/checkout@v4

      # نصب Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # نصب وابستگی‌ها
      - name: Install dependencies
        run: npm ci

      # Build پروژه
      - name: Build
        run: npm run build

      # ساخت ZIP از نسخه Build شده
      - name: Create ZIP
        run: zip -r vuejs-build.zip dist

      # گرفتن نسخه از package.json
      - name: Get version
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # ساخت یا آپدیت Release
      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: Release v${{ steps.package.outputs.version }}
          files: vuejs-build.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # تنظیم GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # آپلود نسخه Build شده برای GitHub Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # Deploy به GitHub Pages
      - name: Deploy
        uses: actions/deploy-pages@v4